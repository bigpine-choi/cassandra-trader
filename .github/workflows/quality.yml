name: Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Check formatting
        run: uv run --frozen ruff format --check src tests

      - name: Run Ruff
        run: uv run --frozen ruff check .

      - name: Run tests
        run: uv run --frozen pytest -q

      - name: Check whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          ensure_commit() {
            local commit_sha="$1"
            if ! git cat-file -e "${commit_sha}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$commit_sha"
            fi
          }

          previous_or_empty_tree() {
            local commit_sha="$1"
            if git rev-parse --verify "${commit_sha}^" >/dev/null 2>&1; then
              printf '%s^\n' "$commit_sha"
            else
              git hash-object -t tree /dev/null
            fi
          }

          case "$EVENT_NAME" in
            pull_request)
              base_sha="$PR_BASE_SHA"
              head_sha="$PR_HEAD_SHA"
              ensure_commit "$base_sha"
              ensure_commit "$head_sha"
              ;;
            push)
              head_sha="$CURRENT_SHA"
              ensure_commit "$head_sha"
              if [[ "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
                base_sha="$(previous_or_empty_tree "$head_sha")"
              else
                base_sha="$PUSH_BEFORE_SHA"
                ensure_commit "$base_sha"
              fi
              ;;
            workflow_dispatch)
              head_sha="$CURRENT_SHA"
              ensure_commit "$head_sha"
              base_sha="$(previous_or_empty_tree "$head_sha")"
              ;;
            *)
              echo "Unsupported event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          git diff --check "$base_sha" "$head_sha"
