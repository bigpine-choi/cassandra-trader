[project]
name = "cassandra-trader"
version = "0.1.0"
description = "Upbit KRW spot long-cash algorithmic trading system"
readme = "README.md"
authors = [
    { name = "Hansol Choi", email = "198446733+bigpine-choi@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
cassandra-trader = "cassandra_trader.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]